name: Release

on:
  workflow_dispatch:
    inputs:
      version:
        description: 'Version (e.g. 0.5.0)'
        required: true
        default: '0.5.0'

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup .NET 10
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Restore
        run: dotnet restore Snapture.sln

      - name: Build
        run: dotnet build Snapture.sln -c Release --no-restore --nologo

      - name: Publish (framework-dependent, win-x64)
        run: |
          dotnet publish src/Snapture.App/Snapture.App.csproj `
            -c Release `
            -r win-x64 `
            --self-contained false `
            -p:PublishSingleFile=false `
            -o publish/win-x64 `
            --nologo

      - name: Package zip + sha256
        shell: pwsh
        run: |
          $version = "${{ inputs.version }}"
          $zip = "Snapture-v$version-win-x64.zip"
          Compress-Archive -Path publish/win-x64/* -DestinationPath $zip -Force
          $sha = (Get-FileHash $zip -Algorithm SHA256).Hash.ToLower()
          "$sha  $zip" | Out-File -FilePath "$zip.sha256" -Encoding ascii -NoNewline
          Write-Host "Built $zip"
          Write-Host "SHA256 $sha"

      - name: Tag if missing
        shell: pwsh
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          $tag = "v${{ inputs.version }}"
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          if (-not (git tag -l $tag)) {
            git tag $tag
            git push origin $tag
          }

      - name: Create or update release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        shell: pwsh
        run: |
          $tag = "v${{ inputs.version }}"
          $exists = gh release view $tag 2>$null
          if (-not $exists) {
            gh release create $tag --title "Snapture $tag" --notes-file CHANGELOG.md
          }
          gh release upload $tag "Snapture-v${{ inputs.version }}-win-x64.zip" "Snapture-v${{ inputs.version }}-win-x64.zip.sha256" --clobber
