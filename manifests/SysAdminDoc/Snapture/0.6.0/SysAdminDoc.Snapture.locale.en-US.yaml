ShortDescription: All-in-one screenshot utility for Windows. Region, window, fullscreen, scrolling, OCR, GIF — local-first with no telemetry.
Description: |-
  Snapture is a desktop screenshot utility for Windows that combines the polish of Snagit with
  the no-cloud philosophy of Greenshot. It ships a WinRT-first capture engine, a vector
  annotation editor with .snapture project round-trip, full-text searchable capture history,
  built-in OCR, scrolling capture with image-stitch alignment, animated GIF recording, a LAN-
  only share server (no cloud account, no upload), Smart Element Capture via UIA, and an
  auto-redact secrets pass that catches API keys / JWTs / AWS keys / cards before you share.
